[project]
name = "behavtest"
version = "0.1.0"
description = "Compile plain-English agent requirements into deterministic, evidence-grounded trace tests"
requires-python = ">=3.11"
dependencies = [
    "agenteval",
    "pydantic>=2.6",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]

[project.scripts]
behavtest = "behavtest.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
agenteval = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/behavtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
