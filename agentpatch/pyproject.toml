[project]
name = "agentpatch"
version = "0.1.0"
description = "Know what broke, why it broke, and whether your agent is still observable."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]

[project.scripts]
agentpatch = "agentpatch.cli:main"

[dependency-groups]
dev = ["pytest>=8", "langgraph>=0.2", "langchain-core>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
